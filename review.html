<style>

*{box-sizing:border-box}

.wrap{max-width:860px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer;font:inherit;color:inherit}

.chk{display:inline-flex;gap:6px;align-items:center;font-size:.88rem;color:var(--muted)}
.banner{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:10px 0}

.head{all:unset;box-sizing:border-box;display:grid;grid-template-columns:12px 1fr auto;gap:2px 12px;align-items:center;width:100%;padding:11px 14px;cursor:pointer}
.head:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line);grid-row:1/3}
.dot.ok{background:var(--ok)}.dot.fix{background:var(--fix)}.dot.bad{background:var(--bad)}.dot.unsure{background:var(--unsure)}
.t1{font-weight:600;overflow-wrap:anywhere}
.t2{font-size:.85rem;color:var(--muted);grid-column:2;overflow-wrap:anywhere}
.t2 .rm{font-family:var(--f-mono)}
.j{font-family:var(--f-jawi);font-size:1.2rem;direction:rtl;color:var(--accent)}
.flag{font-size:.7rem;font-weight:600;color:var(--fix);background:var(--warn-soft);border-radius:6px;padding:1px 7px;margin-left:6px;white-space:nowrap}
.who{font-size:.75rem;color:var(--muted);text-align:right}
.body{padding:4px 14px 16px 40px;display:grid;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{font:inherit;font-size:.88rem;font-weight:600;padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{color:var(--surface)}

.fields input,.body textarea{width:100%}
.fields input.jawi{font-family:var(--f-jawi);font-size:1.15rem;direction:rtl}
.body textarea{min-height:64px;resize:vertical}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-size:.82rem;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:520px){.stats{grid-template-columns:repeat(3,1fr)}.body{padding-left:14px}}

  const r=reviews.get(w.id),s=r?.status||"pending";
  const by=r?`${esc(names[r.by]||"ผู้ตรวจ")} · ${new Date(r.at).toLocaleDateString("th-TH",{day:"numeric",month:"short"})}`:"";
  const sug=r&&(r.sj||r.sr||r.sp||r.sm)?` <span class="flag">มีคำแนะนำ</span>`:"";
  return `<button class="head" aria-expanded="${open.has(w.id)}"><span class="dot ${s}" title="${ST[s]||"รอตรวจ"}"></span>
    <span class="t1">${esc(w.m)}${w.x?'<span class="flag">※ ยังไม่ยืนยัน</span>':""}${sug}</span><span class="who">${by}</span>
    <span class="t2">${esc(w.p)} · <span class="rm">${esc(w.r)}</span> · <span class="j">${esc(w.j)}</span> · ${esc(catName[w.c]||"")}</span></button>
    <div class="body" ${open.has(w.id)?"":"hidden"}>${open.has(w.id)?bodyHTML(w):""}</div>`;
}
function bodyHTML(w){
  const r=reviews.get(w.id)||{},d=draft.get(w.id)||{};
  const v=k=>d[k]??r[k]??"";
  const s=d.status??r.status??"";
  const dis=canWrite?"":"disabled";
  const last=r.at?`ตรวจล่าสุดโดย ${esc(names[r.by]||"ผู้ตรวจ")} เมื่อ ${new Date(r.at).toLocaleString("th-TH")}`:"ยังไม่มีผู้ตรวจ";
  return `<div class="seg">${Object.keys(ST).map(k=>`<button data-s="${k}" aria-pressed="${s===k}" ${dis}>${ST[k]}</button>`).join("")}</div>
  <div class="fields">
    <label>ยาวีที่ถูก (ถ้าต้องแก้)<input class="in jawi" data-f="sj" value="${esc(v("sj"))}" placeholder="${esc(w.j)}" ${dis}></label>
    <label>รูมีที่ถูก<input class="in" data-f="sr" value="${esc(v("sr"))}" placeholder="${esc(w.r)}" ${dis}></label>
    <label>คำอ่านที่ถูก<input class="in" data-f="sp" value="${esc(v("sp"))}" placeholder="${esc(w.p)}" ${dis}></label>
    <label>ความหมายที่ถูก<input class="in" data-f="sm" value="${esc(v("sm"))}" placeholder="${esc(w.m)}" ${dis}></label>
  </div>
  <textarea data-f="note" placeholder="หมายเหตุ เช่น แหล่งอ้างอิง, ใช้ในพื้นที่ไหน, ผู้ป่วยมักพูดว่าอย่างไร" ${dis}>${esc(v("note"))}</textarea>
  <div class="act"><button class="btn primary" data-act="save" ${dis}>บันทึก</button>${r.status?`<button class="btn" data-act="clear" ${dis}>ล้างผลตรวจ</button>`:""}<span class="msg">${last}</span></div>`;
}
function renderList(){
  const list=filtered();
  $("#count").textContent=`แสดง ${list.length} จาก ${W.length}`;
  const ul=$("#list");
  if(!list.length){ul.innerHTML='<li class="empty">ไม่พบคำที่ตรงเงื่อนไข</li>';return}
  ul.innerHTML=list.map(w=>`<li class="row" data-id="${w.id}">${rowHTML(w)}</li>`).join("");
}
function rerow(id){
  const li=document.querySelector(`li.row[data-id="${id}"]`);if(!li)return;
  const w=W.find(x=>x.id===id);li.innerHTML=rowHTML(w);
}
// events (delegated)
$("#list").addEventListener("click",async e=>{
  const li=e.target.closest("li.row");if(!li)return;const id=li.dataset.id;
  if(e.target.closest(".head")){open.has(id)?open.delete(id):open.add(id);rerow(id);return}
  const sb=e.target.closest(".seg button");
  if(sb){const d=draft.get(id)||{};d.status=sb.dataset.s;draft.set(id,d);li.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b===sb));return}
  const act=e.target.closest("[data-act]")?.dataset.act;
  if(act==="save")save(id,li);
  if(act==="clear"){try{await db.doc("reviews/"+id).delete();draft.delete(id)}catch(err){flash(li,"ลบไม่สำเร็จ: "+(err.message||err.code))}}
});
$("#list").addEventListener("input",e=>{
  const li=e.target.closest("li.row");const f=e.target.dataset.f;if(!li||!f)return;
  const d=draft.get(li.dataset.id)||{};d[f]=e.target.value;draft.set(li.dataset.id,d);
});
function flash(li,t){const m=li.querySelector(".act .msg");if(m)m.textContent=t}
async function save(id,li){
  const w=W.find(x=>x.id===id),r=reviews.get(id)||{},d=draft.get(id)||{};
  const g=k=>(d[k]??r[k]??"").toString().trim();
  const status=d.status??r.status;
  if(!status){flash(li,"เลือกสถานะก่อน");return}
  const rec={status,note:g("note"),r:w.r,m:w.m,by:me,at:new Date().toISOString()};
  [["sj",w.j],["sr",w.r],["sp",w.p],["sm",w.m]].forEach(([k,orig])=>{const v=g(k);rec[k]=v&&v!==orig?v:""});
  const keep=draft.get(id);draft.delete(id);
  try{await db.doc("reviews/"+id).set(rec);flash(li,"บันทึกแล้ว")}
  catch(err){draft.set(id,keep||{});flash(li,"บันทึกไม่สำเร็จ: "+(err.message||err.code))}
}
// export
$("#export").onclick=async()=>{
  if(!downloads){alert("ส่งออกไม่ได้ในมุมมองนี้");return}
  const H=["id","หมวด","ยาวี","รูมี","คำอ่าน","ความหมาย","ยังไม่ยืนยันกับหนังสือ","สถานะ","ยาวีที่แก้","รูมีที่แก้","คำอ่านที่แก้","ความหมายที่แก้","หมายเหตุ","ผู้ตรวจ","เวลา"];
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=W.map(w=>{const r=reviews.get(w.id)||{};return [w.id,catName[w.c],w.j,w.r,w.p,w.m,w.x?"ใช่":"",ST[r.status]||"รอตรวจ",r.sj,r.sr,r.sp,r.sm,r.note,names[r.by]||r.by||"",r.at||""]});
  const csv="﻿"+[H,...rows].map(r=>r.map(q).join(",")).join("\r\n");
  try{await downloads.save({filename:"patani-dict-review.csv",data:new Blob([csv],{type:"text/csv;charset=utf-8"})})}catch(e){if(e&&e.code!=="declined")alert("บันทึกไฟล์ไม่สำเร็จ")}
};
// boot
renderStats();renderList();
(async()=>{
  const ban=$("#banner");
  try{
    db=await claude.use("db");const user=await claude.use("user");downloads=await claude.use("downloads");
    if(!db){ban.hidden=false;ban.textContent="ยังเชื่อมฐานข้อมูลไม่ได้ (ต้องเปิดหน้านี้ขณะล็อกอิน claude.ai) — ตอนนี้ดูรายการได้อย่างเดียว บันทึกผลตรวจไม่ได้";return}
    me=user?await user.id():"anon";
    canWrite=user?(user.can("data.write")!==false):true;
    if(!canWrite){ban.hidden=false;ban.textContent="บัญชีนี้มีสิทธิ์ดูอย่างเดียว ขอสิทธิ์ผู้ร่วมแก้ไข (Contributor) จากเจ้าของเพื่อบันทึกผลตรวจ"}
    db.collection("reviews").onSnapshot(async snap=>{
      const ids=new Set();
      snap.docs.forEach(d=>{reviews.set(d.id,d.data());ids.add(d.id)});
      [...reviews.keys()].forEach(k=>{if(!ids.has(k))reviews.delete(k)});
      if(user){try{const ps=await user.profiles([...new Set([...reviews.values()].map(r=>r.by).filter(Boolean))]);for(const k in ps)names[k]=ps[k].name||""}catch(e){}}
      renderStats();
      // refresh only rows without unsaved edits
      document.querySelectorAll("li.row").forEach(li=>{if(!draft.has(li.dataset.id))rerow(li.dataset.id)});
      if(statusFilter)renderList();
    },err=>{ban.hidden=false;ban.textContent="อ่านฐานข้อมูลไม่ได้: "+(err.message||err.code)});
  }catch(e){ban.hidden=false;ban.textContent="เชื่อมฐานข้อมูลไม่สำเร็จ: "+(e.message||e.code||e)}
})();
</script></body></html>

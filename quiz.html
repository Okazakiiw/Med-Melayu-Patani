<style>

<h1>ตรวจคำศัพท์</h1>
<p class="sub">ทดสอบคำศัพท์มลายูปาตานีจากพจนานุกรม เลือกหมวดและรูปแบบได้</p>

<section id="setup" class="panel">
  <label class="f" for="cat">หมวด</label><select id="cat"></select>
  <label class="f" for="dir">รูปแบบข้อสอบ</label>
  <select id="dir">
    <option value="t2m">ดูคำไทย → เลือกคำมลายู</option>
    <option value="m2t">ดูคำมลายู → เลือกความหมายไทย</option>
    <option value="mix">ผสมทั้งสองแบบ</option>
  </select>
  <label class="f" for="num">จำนวนข้อ</label>
  <select id="num"><option>10</option><option selected>20</option><option>30</option><option value="0">ทั้งหมดในหมวด</option></select>
  <label class="chk"><input type="checkbox" id="onlyok" checked> ใช้เฉพาะคำที่ตรวจกับหนังสือแล้ว</label>
  <button class="btn primary" id="start">เริ่มทำข้อสอบ</button>
  <p class="sub" id="avail" style="margin:12px 0 0"></p>
</section>

<section id="play" class="panel" hidden>
  <div class="meta"><span id="no"></span><span id="sc"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="q" id="q"></div><div class="qj" id="qj"></div>
  <div class="opts" id="opts"></div>
  <div class="fb" id="fb" hidden></div>
  <button class="btn primary" id="next" hidden>ข้อถัดไป</button>
</section>

<section id="done" class="panel" hidden>
  <div class="meta"><span>ผลคะแนน</span></div>
  <div class="score" id="final"></div>
  <p class="sub" id="msg" style="text-align:center"></p>
  <div id="wrongBox"><strong>คำที่ควรทบทวน</strong><ul class="rev" id="wrong"></ul></div>
  <div class="row"><button class="btn" id="again">ทำใหม่</button><button class="btn" id="redo">ทำเฉพาะข้อที่ผิด</button></div>
  <div class="row" style="grid-template-columns:1fr"><a class="btn" style="text-align:center;text-decoration:none" href="index.html">กลับไปพจนานุกรม</a></div>
</section>

function applyReviews(map){

    if(!r)return;

      if(r.sj)w.j=r.sj; if(r.sr)w.r=r.sr; if(r.sp)w.p=r.sp; if(r.sm)w.m=r.sm;
      if(r.status==="ok")w.x=false;

    }
  });
}

  let same=pool.filter(x=>x!==w&&x.c===w.c&&key(x)!==target),rest=pool.filter(x=>x!==w&&x.c!==w.c&&key(x)!==target);
  const seen=new Set([target]),out=[];
  for(const x of shuf(same).concat(shuf(rest))){const k=key(x);if(!seen.has(k)){seen.add(k);out.push(x)}if(out.length===3)break}
  return shuf([w,...out]);}
function ask(){
  const {w,d}=qs[i];locked=false;
  $("#no").textContent=`ข้อ ${i+1}/${qs.length}`;$("#sc").textContent=`ถูก ${score}`;
  $("#bar").style.width=(i/qs.length*100)+"%";
  $("#fb").hidden=true;$("#next").hidden=true;
  const showJ=!document.documentElement.classList.contains("nojawi");
  if(d==="t2m"){$("#q").innerHTML=`<small>คำนี้ในภาษามลายูปาตานีคืออะไร</small>${esc(w.m)}`;$("#qj").textContent="";}
  else{$("#q").innerHTML=`<small>คำนี้แปลว่าอะไร</small>${esc(first(w.p))}`;$("#qj").textContent=w.j||"";}
  const o=$("#opts");o.innerHTML="";
  distract(w,d).forEach(x=>{const b=document.createElement("button");b.className="opt";
    b.innerHTML=d==="t2m"?`${esc(first(x.p))}<span class="r">${esc(x.r)}</span>`:esc(x.m);
    b.onclick=()=>pick(b,x===w);b.dataset.ok=x===w?1:0;o.appendChild(b)});
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function pick(b,ok){
  if(locked)return;locked=true;const {w}=qs[i];
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.ok==="1")x.classList.add("ok")});
  if(ok)score++;else{b.classList.add("no");wrong.push(w)}
  const fb=$("#fb");fb.className="fb"+(ok?"":" no");fb.hidden=false;
  fb.innerHTML=`<strong>${ok?"ถูกต้อง":"ยังไม่ถูก"}</strong> · ${esc(w.m)} = ${esc(w.p)} <span style="font-family:var(--f-mono);font-size:.85rem">(${esc(w.r)})</span>`+(w.j?` <span class="j" dir="rtl">${w.j}</span>`:"");
  $("#sc").textContent=`ถูก ${score}`;$("#next").hidden=false;$("#next").textContent=i+1<qs.length?"ข้อถัดไป":"ดูผลคะแนน";$("#next").focus();
}
$("#next").onclick=()=>{i++;if(i<qs.length)ask();else finish()};
function finish(){
  show("done");const n=qs.length,pc=Math.round(score/n*100);
  $("#final").textContent=`${score}/${n}`;
  $("#msg").textContent=pc>=90?"แม่นมาก":pc>=70?"ดี ทบทวนอีกนิดก็พร้อมใช้":"ลองทบทวนคำด้านล่างแล้วทำใหม่";
  $("#wrongBox").hidden=!wrong.length;$("#redo").hidden=!wrong.length;
  $("#wrong").innerHTML=wrong.map(w=>`<li><span class="p">${esc(w.p)}</span> — ${esc(w.m)}<br><span class="r">${esc(w.r)}</span> <span dir="rtl" style="font-family:var(--f-jawi)">${w.j||""}</span></li>`).join("");
}
$("#start").onclick=()=>{pool=usable();begin(pool)};
$("#again").onclick=()=>show("setup");
(async()=>{try{const db=await claude.use("db");if(!db)return;
  const snap=await db.collection("reviews").get();const m=new Map();snap.docs.forEach(d=>m.set(d.id,d.data()));
  applyReviews(m);avail();}catch(e){}})();
$("#redo").onclick=()=>{const w=wrong.slice();pool=usable();if(pool.length<4)pool=DATA.words;qs=shuf(w).map(x=>({w:x,d:dirOf($("#dir").value)}));i=0;score=0;wrong=[];show("play");ask()};
</script></body></html>
